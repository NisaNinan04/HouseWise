<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | HouseWise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        
        .password-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }
        
        .btn-primary {
            background-color: #4f46e5;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }
        
        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        
        .input-field {
            border: 1px solid #d1d5db;
            transition: all 0.2s;
        }
        
        .input-field:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="password-container w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl mx-auto mb-4">H</div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Reset your password</h1>
            <p class="text-gray-600">Enter your email and we'll send you a link to reset your password</p>
        </div>
        
        <form class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                <input type="email" id="email" class="w-full input-field py-3 px-4 rounded-lg" required placeholder="you@example.com">
            </div>
            
            <button type="submit" class="w-full btn-primary py-3 px-4 rounded-lg font-medium">
                Send reset link
            </button>
            
            <div class="text-center text-sm text-gray-600 mt-4">
                Remember your password? <a href="{{ url_for('login') }}" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a>
            </div>
        </form>
    </div>
</body>
</html>
