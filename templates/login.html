<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HouseWise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Purple Decorative Shapes */
        .shape {
            position: absolute;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            border-radius: 20px;
            opacity: 0.8;
            z-index: 1;
        }

        .shape-1 {
            width: 250px;
            height: 150px;
            top: -50px;
            right: 50px;
            border-radius: 0 0 0 80px;
            transform: rotate(10deg);
        }

        .shape-2 {
            width: 180px;
            height: 180px;
            bottom: 50px;
            left: -60px;
            border-radius: 60px;
            transform: rotate(-25deg);
        }

        .shape-3 {
            width: 140px;
            height: 140px;
            top: 40%;
            right: -50px;
            border-radius: 70px 0 70px 70px;
            transform: rotate(30deg);
        }

        .shape-4 {
            width: 120px;
            height: 120px;
            bottom: -30px;
            right: 300px;
            border-radius: 60px;
            opacity: 0.6;
            transform: rotate(45deg);
        }

        .shape-5 {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 5%;
            border-radius: 50px;
            opacity: 0.4;
            transform: rotate(-15deg);
        }

        /* Main Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            width: 100%;
            max-width: 1200px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            color: #64748b;
            font-size: 1rem;
        }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        /* Form Section */
        .form-section {
            width: 100%;
        }

        .welcome-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            border-left: 4px solid #8b5cf6;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .welcome-subtitle {
            color: #64748b;
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #8b5cf6;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 2rem;
        }

        .forgot-password a {
            color: #8b5cf6;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #7c3aed;
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);

        }

            border: 2px solid #e5e7eb;
            padding: 1rem 2rem;
            border-radius: 12px;

        .btn-google:hover {

        }

            text-decoration: none;

<body>
    <!-- Purple Decorative Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>

    <div class="container">
        <div class="login-card">
            <!-- Header -->
            <div class="header">
                <div class="logo">HouseWise</div>
                <h1 class="header-title">Welcome Back</h1>
                <p class="header-subtitle">Sign in to continue managing your finances</p>
            </div>

            <!-- Main Content Grid -->
            <div class="content-grid">
                <!-- Form Section -->
                <div class="form-section">
                    <div class="welcome-section">
                        <h2 class="welcome-title">Welcome Back</h2>
                        <p class="welcome-subtitle">Please enter your details to log in</p>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-group">
                                <input type="password" id="password" name="password" placeholder="••••••••" required>
                                <button type="button" class="password-toggle" onclick="togglePassword()">
                                    <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="forgot-password">
                            <a href="{{ url_for('forgotpw') }}">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-primary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem;">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                <polyline points="10,17 15,12 10,7"></polyline>
                                <line x1="15" y1="12" x2="3" y2="12"></line>
                            </svg>
                            LOGIN
                        </button>

                        <button type="button" class="btn-google">
                            <svg width="20" height="20" viewBox="0 0 24 24">
                                <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Continue with Google
                        </button>

                        <div class="signup-link">
                            Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
                        </div>
                    </form>
                </div>

                <!-- Dashboard Preview Section -->
                <div class="preview-section">
                    <div class="preview-card">


                        <div class="income-display">
                            <div class="track-label">
                                Track Your Income & Expenses

                passwordInput.type = 'text';
                eye.innerHTML = '\n                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>\n                    <line x1="1" y1="1" x2="23" y2="23"></line>\n                ';

        // Add interactive animations to chart bars
        document.querySelectorAll('.bar').forEach((bar, index) => {

                this.style.boxShadow = '0 4px 12px rgba(139, 92, 246, 0.3)';

            bar.addEventListener('mouseleave', function() {

                this.style.boxShadow = 'none';
