<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HouseWise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Purple Decorative Shapes */
        .shape {
            position: absolute;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            border-radius: 20px;
            opacity: 0.8;
            z-index: 1;
        }

        .shape-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            right: 100px;
            border-radius: 0 0 0 60px;
            transform: rotate(15deg);
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            bottom: 100px;
            left: -40px;
            border-radius: 50px;
            transform: rotate(-20deg);
        }

        .shape-3 {
            width: 120px;
            height: 120px;
            top: 50%;
            right: -30px;
            border-radius: 60px 0 60px 60px;
            transform: rotate(45deg);
        }

        .shape-4 {
            width: 100px;
            height: 100px;
            bottom: -20px;
            right: 200px;
            border-radius: 50px;
            opacity: 0.6;
        }

        /* Main Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .signup-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            width: 100%;
            max-width: 1200px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            color: #64748b;
            font-size: 1rem;
        }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        /* Form Section */
        .form-section {
            width: 100%;
        }

        .profile-upload {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            border: 2px dashed #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-upload:hover {
            border-color: #8b5cf6;
            background: #faf5ff;
        }

        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            position: relative;
            overflow: hidden;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .add-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            background: #8b5cf6;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .upload-text {
            flex: 1;
        }

        .upload-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }

        .upload-subtitle {
            color: #64748b;
            font-size: 0.875rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.25rem;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-google {
            width: 100%;
            background: white;
            color: #374151;
            border: 2px solid #e5e7eb;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-google:hover {
            border-color: #8b5cf6;
            background: #faf5ff;
        }

        .login-link {
            text-align: center;
            color: #64748b;
        }

        .login-link a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Dashboard Preview Section */
        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .income-display {
            text-align: center;
            margin-bottom: 2rem;
        }

        .track-label {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .chart-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .amount {
            font-size: 2rem;
            font-weight: 800;
            color: #1e293b;
        }

        .chart-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .chart-title {
            font-weight: 600;
            color: #1e293b;
        }

        .chart-period {
            color: #64748b;
            font-size: 0.75rem;
        }

        .view-more {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .profile-upload {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            border: 2px dashed #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .bar-chart {
            display: flex;
            align-items: end;
            justify-content: space-between;
            height: 120px;
            gap: 0.5rem;
        }

        .bar {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            border-radius: 4px 4px 0 0;
            min-width: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .bar:hover {
            opacity: 0.8;
        }

        .bar-1 { height: 60%; opacity: 0.8; }
        .bar-2 { height: 80%; }
        .bar-3 { height: 75%; opacity: 0.9; }
        .bar-4 { height: 65%; opacity: 0.7; }
        .bar-5 { height: 45%; opacity: 0.6; }
        .bar-6 { height: 90%; }
        .bar-7 { height: 70%; opacity: 0.8; }

        .chart-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
        }

        .chart-labels span {
            font-size: 0.75rem;
            color: #64748b;
        }

    <div class="container">
        <div class="signup-card">
            <!-- Header -->
            <div class="header">
                <div class="logo">HouseWise</div>
                <h1 class="header-title">Create an Account</h1>
                <p class="header-subtitle">Join thousands of users managing their finances smartly</p>
            </div>

            <!-- Main Content Grid -->
            <div class="content-grid">
                <!-- Form Section -->
                <div class="form-section">
                    <div class="profile-upload" onclick="document.getElementById('profileInput').click()">

                    <input type="file" id="profileInput" style="display: none;" accept="image/*">

                    <form action="{{ url_for('signup') }}" method="POST">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Full Name</label>
                                <input type="text" id="fullName" name="fullname" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-group">
                                <input type="password" id="password" name="password" placeholder="Min 8 Characters" required>
                                <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword()">

                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">

                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            SIGN UP
                        </button>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const eye = document.getElementById('passwordEye');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            // swap icon between eye and eye-off
            if (isHidden) {
                eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>';
            } else {
                eye.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.06"/><path d="M1 1l22 22"/><path d="M9.88 9.88A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88"/><path d="M14.12 14.12L9.88 9.88"/>';
            }
        }

        // Profile picture upload
        document.getElementById('profileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.querySelector('.profile-pic img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.querySelector('.profile-pic svg').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Add some interactive animations
        document.querySelectorAll('.bar').forEach((bar) => {
            bar.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.1)';
            });
            
            bar.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
